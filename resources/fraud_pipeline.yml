resources:
  jobs:
    fraud_pipeline:
      name: databricks-${bundle.target}-fraud-pipeline

      # One ephemeral job cluster shared by all tasks. The policy fixes Spark version, node type,
      # access mode and caps workers; apply_policy_default_values fills the fixed values in.
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster:
            policy_id: ${var.job_policy_id}
            apply_policy_default_values: true
            num_workers: 1

      tasks:
        - task_key: bronze
          job_cluster_key: pipeline
          notebook_task:
            notebook_path: ../src/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              data_bucket: ${var.data_bucket}

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          job_cluster_key: pipeline
          notebook_task:
            notebook_path: ../src/02_silver_clean.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold
          depends_on: [{ task_key: silver }]
          job_cluster_key: pipeline
          notebook_task:
            notebook_path: ../src/03_gold_features.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: train
          depends_on: [{ task_key: gold }]
          job_cluster_key: pipeline
          notebook_task:
            notebook_path: ../src/04_train_mlflow.py
            base_parameters:
              catalog: ${var.catalog}
              experiment_path: /Shared/${bundle.target}/fraud-detection

        - task_key: export
          depends_on: [{ task_key: gold }]
          job_cluster_key: pipeline
          notebook_task:
            notebook_path: ../src/05_export_gold.py
            base_parameters:
              catalog: ${var.catalog}
              data_bucket: ${var.data_bucket}
